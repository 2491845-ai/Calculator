 #ff741b14}.inputwrap input[aria-invalid=true]{border-color:#ffafa2}.inputwrap span{position:absolute;right:15px;top:16px;color:#b99d86}.hint{font-size:11px;color:var(--muted);display:block;margin-top:7px;line-height:1.6}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.level{border:1px solid #583a28;background:#17110d;border-radius:10px;padding:11px 4px;font-size:19px;font-variant-numeric:tabular-nums}.level.active{background:#4c2d17;border-color:var(--orange);color:var(--peach)}.level:hover{border-color:#c77a42}.input-note{color:var(--muted);font-size:11px;padding-top:19px;border-top:1px solid var(--line);margin:24px 0 0;line-height:1.7}.output{min-width:0}.result{padding:25px 28px;background:linear-gradient(120deg,#302015,#211913 75%)}.result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}.badge{font-size:11px;padding:5px 10px;border:1px solid #8b5028;border-radius:30px;background:#4b2a15;color:var(--peach)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:28px}.answer+.answer{border-left:1px solid #60402a;padding-left:28px}.answer-label{font-size:12px;color:#dcc2af;margin-bottom:9px}.amount{font-size:clamp(28px,3vw,44px);letter-spacing:-1.4px;font-weight:500;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}.amount span{font-size:.65em;color:#c2a185;letter-spacing:-.5px}.answer.client .amount{color:var(--peach)}.change{color:var(--muted);font-size:11px;margin-top:13px}.change strong{color:#e6c1a2;font-weight:400}.chartpanel{margin-top:17px;padding:22px 25px 18px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:14px}.chart-head h2{font-size:15px}.legend{display:flex;gap:16px;font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:2px;background:var(--orange)}.legend .pay{background:var(--peach)}.chart{display:block;width:100%;height:auto}.schedule{margin-top:17px;padding:20px 24px}.schedule h2{font-size:15px;margin-bottom:13px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}th{text-align:right;color:var(--muted);font-weight:400;font-size:10px;padding:0 8px 11px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:12px 8px;border-bottom:1px solid #3b2a20;white-space:nowrap}tr:last-child td{border:0}.nextrow{background:#42281980}.nextrow td:first-child{color:var(--peach)}td.pay{color:var(--peach)}.nowrow{color:var(--muted)}.percent{color:var(--muted);font-size:10px;display:block}.footnote{color:#ad9786;font-size:10px;margin:13px 1px 0;line-height:1.65}.error{padding:55px 28px;text-align:center;color:var(--peach)}.error p{font-size:13px;color:var(--muted);max-width:350px;margin:12px auto 0}.hidden{display:none!important}.unit-result{display:flex;align-items:baseline;gap:8px;margin-top:9px;color:#e9c4ab;font-size:16px}.unit-result small{font-size:10px;color:var(--muted)}

@media(max-width:740px){.jump-inputs{padding:23px}.jump-selects .field-label{font-size:12px}.jump-answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}.jump-answer+.jump-answer{margin-top:0}.jump-growth,.jump-note{grid-column:1/-1;margin-top:0}.jump-amount{font-size:25px}.jump-answers .answer-label{min-height:34px}}

<body>
<main class="shell"><header class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Авито Недвижимость</header><section class="intro"><div class="eyebrow">Калькулятор ППС</div><h1>Программа прогрессивной скидки</h1><p>Сумма в админке и оплата клиента с учётом скидки.</p></section><div class="workspace"><div class="left-column"><aside class="panel inputs"><h2>Сейчас у клиента</h2><label class="field"><span class="field-label" id="budgetLabel">Текущая оплата клиента</span><span class="inputwrap" style="display:block"><input id="budget" type="text" inputmode="decimal" autocomplete="off" value="100 000" aria-describedby="budgetHint"><span>₽</span></span><span class="hint" id="budgetHint"></span></label><div class="field"><span class="field-label" id="discountLabel">Текущий уровень скидки ППС</span><div class="levels" role="group" aria-labelledby="discountLabel" id="levels"></div></div><p class="input-note" id="ruleNote"></p></aside><aside class="panel jump-inputs"><div class="jump-heading"><h2>Скачок скидки</h2><span class="jump-symbol" aria-hidden="true">↗</span></div><div class="jump-selects"><label><span class="field-label">Текущая скидка</span><select id="jumpFrom" aria-label="Текущая скидка для скачка"></select></label><label><span class="field-label">Новая скидка</span><select id="jumpTo" aria-label="Новая скидка после скачка"></select></label></div><div id="jumpResult" aria-live="polite"></div></aside></div><section class="output" id="output" aria-label="Расчёт тарифа"></section></div></main>
<script>
'use strict';
// Confirmed rules: current payment after discount, +5% per monthly step, capped at 25%.
const MONTHLY_GROWTH=.05;
const RATES=[0,4,8,10,12,15,20,25];
const DEFAULTS={budget:'100000',discount:0,jumpTo:15};
const STORAGE='avito-pps-payment-v4';
let state={...DEFAULTS};try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object'){if(typeof saved.budget==='string')state.budget=saved.budget;if(RATES.includes(saved.discount))state.discount=saved.discount;if(RATES.includes(saved.jumpTo))state.jumpTo=saved.jumpTo}}catch(e){}
const $=id=>document.getElementById(id),nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}),df=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}),precise=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>nf.format(n)+' ₽',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function parsePositive(str,label,integer=false){const raw=String(str).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!/^\d+(\.\d+)?$/.test(raw))throw Error('Укажите '+label+'.');const n=Number(raw);if(!Number.isFinite(n)||n<=0||(integer&&!Number.isInteger(n)))throw Error('Укажите '+(integer?'целое число':'сумму')+' больше нуля: '+label+'.');return n}
const CONFIG={"inputKind": "payment", "growthBase": "gross", "zeroFirstMonth": true, "includeTen": true};
const JUMP_GROWTH={'0:4':.10,'0:8':.16,'0:10':.22,'0:12':.28,'0:15':.34};
function currentAmounts(s=state){
 const input=parsePositive(s.budget,CONFIG.inputKind==='gross'?'текущий тариф до скидки':'текущую оплату клиента');
 if(!RATES.includes(s.discount))throw Error('Выберите текущую скидку.');
 const gross=CONFIG.inputKind==='gross'?input:input/(1-s.discount/100);
 const pay=CONFIG.inputKind==='gross'?input*(1-s.discount/100):input;
 if(!Number.isFinite(gross)||!Number.isFinite(pay))throw Error('Сумма слишком велика.');
 return {input,gross,pay};
}
function calculate(s=state){
 const current=currentAmounts(s),index=RATES.indexOf(s.discount),zeroStart=CONFIG.zeroFirstMonth&&index===0;
 const months=Math.max(1,RATES.length-1-index+(zeroStart?1:0));
 const rows=[{month:0,discount:s.discount,gross:current.gross,pay:current.pay,growth:0,grossChange:0,payChange:0,netGrowth:0}];
 for(let month=1;month<=months;month++){
  const previous=rows[month-1],level=Math.min(index+Math.max(0,month-(zeroStart?1:0)),RATES.length-1),atCap=previous.discount===25;
  const base=CONFIG.growthBase==='gross'?previous.gross:previous.pay;
  const gross=atCap?previous.gross:base*(1+MONTHLY_GROWTH),pay=atCap?previous.pay:gross*(1-RATES[level]/100);
  if(!Number.isFinite(gross)||!Number.isFinite(pay))throw Error('Сумма слишком велика. Уменьшите исходное значение.');
  rows.push({month,discount:RATES[level],gross,pay,growth:atCap?0:MONTHLY_GROWTH,grossChange:atCap?0:gross-base,payChange:pay-previous.pay,netGrowth:pay/previous.pay-1});
 }
 return {input:current.input,rows};
}
function calculateJump(s=state){
 const current=currentAmounts(s),input=CONFIG.growthBase==='gross'?current.gross:current.pay,from=s.discount,to=s.jumpTo;
 if(to>15)return {unavailable:true,message:'На 20% и 25% можно перейти только последовательно по месяцам.'};
 if(!RATES.includes(from)||!RATES.includes(to)||to<=from)return {unavailable:true,message:'Выберите скидку выше текущей.'};
 const adjacent=RATES.indexOf(to)===RATES.indexOf(from)+1;
 const growth=JUMP_GROWTH[from+':'+to]??(RATES.indexOf(to)-RATES.indexOf(from)+(from===0?1:0))*MONTHLY_GROWTH;
 if(growth===undefined)return {unavailable:true,message:'Для перехода '+from+'% → '+to+'% прирост пока не задан.'};
 const gross=input*(1+growth),pay=gross*(1-to/100);
 if(!Number.isFinite(gross)||!Number.isFinite(pay))throw Error('Сумма слишком велика.');
 return {from,to,growth,gross,pay,increase:gross-input,payChange:pay-input};
}
function renderJump(){
 $('jumpFrom').innerHTML=RATES.map(r=>`<option value="${r}" ${state.discount===r?'selected':''}>${r}%</option>`).join('');
 const targets=RATES.filter(r=>r>state.discount&&r<=15);
 if(!targets.includes(state.jumpTo))state.jumpTo=targets.find(r=>r>=15)||targets[0]||25;
 $('jumpTo').innerHTML=targets.length?targets.map(r=>`<option value="${r}" ${state.jumpTo===r?'selected':''}>${r}%</option>`).join(''):'<option>Недоступно</option>';
 if(targets.length)$('jumpTo').innerHTML+='<option disabled>20% · только по месяцам</option><option disabled>25% · только по месяцам</option>';
 $('jumpTo').disabled=!targets.length;
 if(!targets.length){$('jumpResult').innerHTML='<p class="jump-empty">Скачок доступен только на скидки до <b>15%</b>. На 20% и 25% переходят последовательно по месяцам.</p>';return}
 try{const r=calculateJump();if(r.unavailable){$('jumpResult').innerHTML=`<p class="jump-empty">${esc(r.message)}</p>`;return}
 $('jumpResult').innerHTML=`<div class="jump-answers"><div class="jump-answer"><div class="answer-label">Собрать в админке</div><div class="jump-amount">${money(r.gross)}</div></div><div class="jump-answer"><div class="answer-label">Оплата после скидки ${r.to}%</div><div class="jump-amount client">${money(r.pay)}</div></div><p class="jump-growth">Прирост <strong>${signed(r.growth,percentage)} · ${signed(r.increase)}</strong></p><p class="jump-note">Скачок применяется на ближайшее продление. С 0%: на 4% — +10%, на 8% — +16%, на 10% — +22%, на 12% — +28%, на 15% — +34%. С других скидок — по 5% за каждый уровень. Скачки на 20% и 25% недоступны.</p></div>`;
 }catch(e){$('jumpResult').innerHTML=`<p class="jump-empty">${esc(e.message)}</p>`}
}

function signed(n,format=money){return (n>1e-8?'+':n< -1e-8?'−':'')+format(Math.abs(n))}
function percentage(n){return df.format(n*100)+'%'}
function chart(rows){const mobile=innerWidth<=740,W=mobile?Math.max(270,innerWidth-66):760,H=mobile?240:235,L=mobile?56:72,R=mobile?15:23,T=22,B=33,n=rows.length;const max=Math.max(...rows.map(r=>r.gross))*1.12,rawStep=max/3,mag=10**Math.floor(Math.log10(rawStep)),scale=[1,2,2.5,5,7.5,10].find(v=>v>=rawStep/mag)||10,step=scale*mag,ymax=step*3;const x=i=>L+(W-L-R)*i/(n-1),y=v=>H-B-(H-T-B)*v/ymax;const tick=v=>v>=1e6?df.format(v/1e6)+' млн':v>=1000?df.format(v/1000)+' тыс.':nf.format(v);let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">Стоимость тарифа по месяцам до достижения скидки 25%</title><desc id="chartDesc">${rows.map(r=>`${r.month?'Месяц '+r.month:'Сейчас'}: собрать в админке ${money(r.gross)}, скидка ${r.discount}%, оплата клиента ${money(r.pay)}`).join('. ')}</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb68d" stop-opacity=".12"/><stop offset="1" stop-color="#ffb68d" stop-opacity="0"/></linearGradient></defs>`;for(let t=0;t<=3;t++)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(t*step)}" y2="${y(t*step)}" stroke="#463124"/><text x="${L-11}" y="${y(t*step)+4}" fill="#bca18d" text-anchor="end" font-size="${mobile?9:10}">${tick(t*step)}</text>`;const pts=key=>rows.map((r,i)=>`${x(i)},${y(r[key])}`).join(' ');svg+=`<path d="M${x(0)},${H-B} L${pts('pay').replaceAll(' ',' L')} L${x(n-1)},${H-B} Z" fill="url(#shade)"/><line x1="${x(1)}" x2="${x(1)}" y1="${T}" y2="${H-B}" stroke="#7d4b2b" stroke-dasharray="3 5"/><polyline points="${pts('gross')}" fill="none" stroke="#ff741b" stroke-width="2.6" stroke-linejoin="round"/><polyline points="${pts('pay')}" fill="none" stroke="#ffb68d" stroke-width="2.6" stroke-linejoin="round"/>`;rows.forEach((r,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(r.gross)}" r="${i===1?4.5:3}" fill="#ff741b"/><circle cx="${x(i)}" cy="${y(r.pay)}" r="${i===1?4.5:3}" fill="#ffb68d"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="${i===1?'#ffb68d':'#bca18d'}" font-size="${mobile?9:10}">${i?(mobile?i+'м.':'+'+i+' мес.'):'Сейчас'}</text>`});return svg+'</svg>'}
function renderInputs(){
 $('budget').value=formatInput(state.budget);
 $('levels').innerHTML=RATES.map(rate=>`<button class="level ${state.discount===rate?'active':''}" data-discount="${rate}" aria-pressed="${state.discount===rate}">${rate}%</button>`).join('');
 $('budgetHint').textContent='Сумма, которую клиент платит с учётом текущей скидки.';
 $('ruleNote').textContent='На продлении: +5% к тарифу до скидки, затем скидка. При старте с 0% в первый месяц скидки нет. На 25% рост останавливается.';
}
function formatInput(raw){const n=String(raw).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(n)&&Number.isFinite(Number(n))?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:8}).format(Number(n)):raw}
function renderResults(){let c;try{c=calculate();$('budget').removeAttribute('aria-invalid')}catch(e){$('output').innerHTML=`<div class="panel error"><h2>Проверьте исходные данные</h2><p>${esc(e.message)}</p></div>`;return}const next=c.rows[1];$('output').innerHTML=`<div class="panel result"><div class="result-head"><h2>На ближайшее продление</h2><span class="badge">${next.discount===0?'Без скидки':'Скидка '+next.discount+'%'}</span></div><div class="answers"><div class="answer"><div class="answer-label">Собрать в админке</div><div class="amount">${nf.format(next.gross)} <span>₽</span></div><div class="change">Прирост тарифа <strong>${signed(next.grossChange)} · ${signed(next.growth,percentage)}</strong></div></div><div class="answer client"><div class="answer-label">Оплата клиента после скидки</div><div class="amount">${nf.format(next.pay)} <span>₽</span></div><div class="change">Изменение оплаты <strong>${signed(next.payChange)} · ${signed(next.netGrowth,percentage)}</strong></div></div></div></div><div class="panel chartpanel"><div class="chart-head"><h2>Как меняется стоимость</h2><div class="legend"><span><i></i>В админке</span><span><i class="pay"></i>Оплата клиента</span></div></div>${chart(c.rows)}</div><div class="panel schedule"><h2>Расчёт по месяцам</h2><div class="table-scroll"><table><thead><tr><th>Период</th><th>Сумма в админке<br>и прирост</th><th>Скидка</th><th>Оплата клиента</th></tr></thead><tbody>${c.rows.map(r=>`<tr class="${r.month===0?'nowrow':r.month===1?'nextrow':''}"><td>${r.month?r.month+'-й месяц':'Сейчас'}</td><td>${money(r.gross)}${r.month?`<span class="percent">${signed(r.growth,percentage)} · ${signed(r.grossChange)}</span>`:''}</td><td>${r.discount}%</td><td class="pay">${money(r.pay)}</td></tr>`).join('')}</tbody></table></div><p class="footnote">Оплата клиента = сумма в админке × (1 − скидка). Каждые +5% считаются от тарифа до скидки предыдущего месяца. На экране суммы округлены до рубля.</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-discount]');if(!b)return;state.discount=Number(b.dataset.discount);save();renderInputs();renderResults();renderJump();save();document.querySelector(`[data-discount="${state.discount}"]`)?.focus({preventScroll:true})});
for(const key of ['budget']){$(key).addEventListener('input',e=>{state[key]=e.target.value;save();renderResults();renderJump()});$(key).addEventListener('blur',e=>{e.target.value=formatInput(state[key])})}
let resizeFrame;addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(renderResults)});
$('jumpFrom').addEventListener('change',e=>{state.discount=Number(e.target.value);renderInputs();renderResults();renderJump();save()});
$('jumpTo').addEventListener('change',e=>{state.jumpTo=Number(e.target.value);renderJump();save()});
renderInputs();renderResults();renderJump();
</script>
</body>
</html>
