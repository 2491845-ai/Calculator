<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор ППС — Авито Недвижимость</title>
<style>
:root{color-scheme:dark;--bg:#140f0c;--panel:#211913;--line:#473125;--muted:#bea99b;--text:#fff7f0;--orange:#ff741b;--peach:#ffb68d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#4d2b19 0,transparent 43%),var(--bg);font:14px/1.5 Arial,Helvetica,sans-serif;color:var(--text)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--peach);outline-offset:3px}.shell{max-width:1330px;padding:32px 42px;margin:0 auto}.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:11px}.mark{width:30px;height:32px;position:relative}.mark i{position:absolute;border-radius:50%}.mark i:nth-child(1){width:17px;height:17px;background:#00d764;top:14px;left:0}.mark i:nth-child(2){width:14px;height:14px;background:#00aaff;top:0;left:16px}.mark i:nth-child(3){width:10px;height:10px;background:#965eeb;top:2px;left:7px}.mark i:nth-child(4){width:11px;height:11px;background:#ff4053;top:19px;left:20px}.intro{margin:38px 0 30px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--orange);margin-bottom:8px}h1{font-size:42px;font-weight:500;line-height:1.15;letter-spacing:-1.5px;margin:0 0 10px}.intro p{margin:0;color:var(--muted);font-size:13px}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px}.inputs{padding:25px 23px}h2{font-size:16px;font-weight:500;letter-spacing:-.3px;margin:0}.inputs h2{margin-bottom:25px}.field{display:block;margin:0 0 23px}.field-label{display:block;font-size:12px;color:#e2cdbf;margin-bottom:9px}.inputwrap{position:relative}.inputwrap input{width:100%;padding:13px 43px 13px 14px;border:1px solid #79502e;border-radius:10px;background:#17110d;color:var(--text);font-size:24px;outline:none;font-variant-numeric:tabular-nums}.inputwrap input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff741b14}.inputwrap input[aria-invalid=true]{border-color:#ffafa2}.inputwrap span{position:absolute;right:15px;top:16px;color:#b99d86}.hint{font-size:11px;color:var(--muted);display:block;margin-top:7px;line-height:1.6}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level{border:1px solid #583a28;background:#17110d;border-radius:10px;padding:11px 4px;font-size:19px;font-variant-numeric:tabular-nums}.level.active{background:#4c2d17;border-color:var(--orange);color:var(--peach)}.level:hover{border-color:#c77a42}.input-note{color:var(--muted);font-size:11px;padding-top:19px;border-top:1px solid var(--line);margin:24px 0 0;line-height:1.7}.output{min-width:0}.result{padding:25px 28px;background:linear-gradient(120deg,#302015,#211913 75%)}.result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}.badge{font-size:11px;padding:5px 10px;border:1px solid #8b5028;border-radius:30px;background:#4b2a15;color:var(--peach)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:28px}.answer+.answer{border-left:1px solid #60402a;padding-left:28px}.answer-label{font-size:12px;color:#dcc2af;margin-bottom:9px}.amount{font-size:clamp(28px,3vw,44px);letter-spacing:-1.4px;font-weight:500;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}.amount span{font-size:.65em;color:#c2a185;letter-spacing:-.5px}.answer.client .amount{color:var(--peach)}.change{color:var(--muted);font-size:11px;margin-top:13px}.change strong{color:#e6c1a2;font-weight:400}.chartpanel{margin-top:17px;padding:22px 25px 18px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:14px}.chart-head h2{font-size:15px}.legend{display:flex;gap:16px;font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:2px;background:var(--orange)}.legend .pay{background:var(--peach)}.chart{display:block;width:100%;height:auto}.schedule{margin-top:17px;padding:20px 24px}.schedule h2{font-size:15px;margin-bottom:13px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}th{text-align:right;color:var(--muted);font-weight:400;font-size:10px;padding:0 8px 11px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:12px 8px;border-bottom:1px solid #3b2a20;white-space:nowrap}tr:last-child td{border:0}.nextrow{background:#42281980}.nextrow td:first-child{color:var(--peach)}td.pay{color:var(--peach)}.nowrow{color:var(--muted)}.percent{color:var(--muted);font-size:10px;display:block}.footnote{color:#ad9786;font-size:10px;margin:13px 1px 0;line-height:1.65}.error{padding:55px 28px;text-align:center;color:var(--peach)}.error p{font-size:13px;color:var(--muted);max-width:350px;margin:12px auto 0}.hidden{display:none!important}.unit-result{display:flex;align-items:baseline;gap:8px;margin-top:9px;color:#e9c4ab;font-size:16px}.unit-result small{font-size:10px;color:var(--muted)}
@media(max-width:1000px){.shell{padding:28px}.workspace{grid-template-columns:280px minmax(0,1fr);gap:17px}.inputs{padding:23px 20px}.result{padding:23px}.answers{gap:18px}.answer+.answer{padding-left:18px}.amount{font-size:31px}.chartpanel{padding:21px 17px}.schedule{padding:20px 16px}.change{max-width:170px}}@media(max-width:740px){.shell{padding:23px 18px}.brand{font-size:17px}.intro{margin:30px 0 24px}h1{font-size:34px}.intro p{font-size:12px}.workspace{grid-template-columns:1fr}.inputs{padding:23px}.inputs h2{margin-bottom:21px}.input-note{margin-top:20px;padding-top:16px}.result{padding:22px 20px}.result-head{margin-bottom:21px}.answers{gap:16px}.answer+.answer{padding-left:16px}.amount{font-size:30px}.answer-label{font-size:11px;min-height:34px;display:flex;align-items:flex-end}.change{font-size:10px;line-height:1.7}.chartpanel{padding:20px 12px 15px}.chart-head{padding:0 7px;gap:10px}.legend{font-size:9px;gap:12px}.chart{min-height:220px}.schedule{padding:19px 13px}table{font-size:11px;min-width:0}td,th{padding-left:6px;padding-right:6px}.footnote{padding:0 2px}}@media(max-width:370px){.shell{padding:20px 12px}.amount{font-size:26px}table{font-size:10px}th{font-size:9px}.percent{font-size:9px}.result{padding:20px 16px}.answers{gap:13px}.answer+.answer{padding-left:13px}}@media print{body{background:var(--bg);print-color-adjust:exact;-webkit-print-color-adjust:exact}.shell{padding:10px}.workspace{grid-template-columns:250px minmax(0,1fr)}.intro{margin:20px 0}.panel{break-inside:avoid}.amount{font-size:30px}.schedule{padding:16px}td{padding:9px 6px}}
</style>
</head>
<body>
<main class="shell"><header class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Авито Недвижимость</header><section class="intro"><div class="eyebrow">Программа прогрессивных скидок</div><h1>Калькулятор ППС</h1><p>Сумма в админке и оплата клиента с учётом скидки.</p></section><div class="workspace"><aside class="panel inputs"><h2>Сейчас у клиента</h2><label class="field"><span class="field-label" id="budgetLabel">Текущая стоимость тарифа</span><span class="inputwrap" style="display:block"><input id="budget" type="text" inputmode="decimal" autocomplete="off" value="100 000" aria-describedby="budgetHint"><span>₽</span></span><span class="hint" id="budgetHint"></span></label><div class="field"><span class="field-label" id="discountLabel">Текущий уровень скидки ППС</span><div class="levels" role="group" aria-labelledby="discountLabel" id="levels"></div></div><p class="input-note" id="ruleNote"></p></aside><section class="output" id="output" aria-label="Расчёт тарифа"></section></div></main>
<script>
'use strict';
// Confirmed rules: current gross tariff, +5% per monthly step, capped at 25%.
const MONTHLY_GROWTH=.05;
const RATES=[4,8,12,15,20,25];
const DEFAULTS={budget:'100000',discount:4};
const STORAGE='avito-pps-simple-v2';
let state={...DEFAULTS};try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object'){if(typeof saved.budget==='string')state.budget=saved.budget;if(RATES.includes(saved.discount))state.discount=saved.discount}}catch(e){}
const $=id=>document.getElementById(id),nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}),df=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}),precise=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>nf.format(n)+' ₽',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function parsePositive(str,label,integer=false){const raw=String(str).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!/^\d+(\.\d+)?$/.test(raw))throw Error('Укажите '+label+'.');const n=Number(raw);if(!Number.isFinite(n)||n<=0||(integer&&!Number.isInteger(n)))throw Error('Укажите '+(integer?'целое число':'сумму')+' больше нуля: '+label+'.');return n}
function calculate(s=state){
 const input=parsePositive(s.budget,'текущую стоимость тарифа'),index=RATES.indexOf(s.discount);
 if(index<0)throw Error('Выберите текущую скидку.');
 let gross=input,previousPay=gross*(1-s.discount/100),rows=[];
 for(let month=0;month<=6;month++){
  const level=Math.min(index+month,RATES.length-1);
  const growth=month>0&&index+month<RATES.length?MONTHLY_GROWTH:0;
  const previousGross=gross;
  if(month>0)gross*=1+growth;
  const pay=gross*(1-RATES[level]/100);
  if(!Number.isFinite(gross)||!Number.isFinite(pay))throw Error('Сумма слишком велика. Уменьшите исходное значение.');
  rows.push({month,discount:RATES[level],gross,pay,growth,grossChange:month?gross-previousGross:0,payChange:month?pay-previousPay:0,netGrowth:month?pay/previousPay-1:0});
  previousPay=pay;
 }
 return {input,rows};
}
function signed(n,format=money){return (n>1e-8?'+':n< -1e-8?'−':'')+format(Math.abs(n))}
function percentage(n){return df.format(n*100)+'%'}
function chart(rows){const mobile=innerWidth<=740,W=mobile?Math.max(270,innerWidth-66):760,H=mobile?240:235,L=mobile?56:72,R=mobile?15:23,T=22,B=33,n=rows.length;const max=Math.max(...rows.map(r=>r.gross))*1.12,rawStep=max/3,mag=10**Math.floor(Math.log10(rawStep)),scale=[1,2,2.5,5,7.5,10].find(v=>v>=rawStep/mag)||10,step=scale*mag,ymax=step*3;const x=i=>L+(W-L-R)*i/(n-1),y=v=>H-B-(H-T-B)*v/ymax;const tick=v=>v>=1e6?df.format(v/1e6)+' млн':v>=1000?df.format(v/1000)+' тыс.':nf.format(v);let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">Стоимость тарифа сейчас и на ближайшие 6 месяцев</title><desc id="chartDesc">${rows.map(r=>`${r.month?'Месяц '+r.month:'Сейчас'}: собрать в админке ${money(r.gross)}, скидка ${r.discount}%, оплата клиента ${money(r.pay)}`).join('. ')}</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb68d" stop-opacity=".12"/><stop offset="1" stop-color="#ffb68d" stop-opacity="0"/></linearGradient></defs>`;for(let t=0;t<=3;t++)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(t*step)}" y2="${y(t*step)}" stroke="#463124"/><text x="${L-11}" y="${y(t*step)+4}" fill="#bca18d" text-anchor="end" font-size="${mobile?9:10}">${tick(t*step)}</text>`;const pts=key=>rows.map((r,i)=>`${x(i)},${y(r[key])}`).join(' ');svg+=`<path d="M${x(0)},${H-B} L${pts('pay').replaceAll(' ',' L')} L${x(n-1)},${H-B} Z" fill="url(#shade)"/><line x1="${x(1)}" x2="${x(1)}" y1="${T}" y2="${H-B}" stroke="#7d4b2b" stroke-dasharray="3 5"/><polyline points="${pts('gross')}" fill="none" stroke="#ff741b" stroke-width="2.6" stroke-linejoin="round"/><polyline points="${pts('pay')}" fill="none" stroke="#ffb68d" stroke-width="2.6" stroke-linejoin="round"/>`;rows.forEach((r,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(r.gross)}" r="${i===1?4.5:3}" fill="#ff741b"/><circle cx="${x(i)}" cy="${y(r.pay)}" r="${i===1?4.5:3}" fill="#ffb68d"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="${i===1?'#ffb68d':'#bca18d'}" font-size="${mobile?9:10}">${i?'+'+i+' мес.':'Сейчас'}</text>`});return svg+'</svg>'}
function renderInputs(){
 $('budget').value=formatInput(state.budget);
 $('levels').innerHTML=RATES.map(rate=>`<button class="level ${state.discount===rate?'active':''}" data-discount="${rate}" aria-pressed="${state.discount===rate}">${rate}%</button>`).join('');
 $('budgetHint').textContent='Сумма в админке до текущей скидки.';
 $('ruleNote').textContent='Каждый месяц: +5% к сумме в админке и следующий уровень скидки. На 25% рост останавливается.';
}
function formatInput(raw){const n=String(raw).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(n)&&Number.isFinite(Number(n))?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:8}).format(Number(n)):raw}
function renderResults(){let c;try{c=calculate();$('budget').removeAttribute('aria-invalid')}catch(e){$('output').innerHTML=`<div class="panel error"><h2>Проверьте исходные данные</h2><p>${esc(e.message)}</p></div>`;return}const next=c.rows[1];$('output').innerHTML=`<div class="panel result"><div class="result-head"><h2>На ближайшее продление</h2><span class="badge">Скидка ${next.discount}%</span></div><div class="answers"><div class="answer"><div class="answer-label">Собрать в админке</div><div class="amount">${nf.format(next.gross)} <span>₽</span></div><div class="change">Прирост <strong>${signed(next.grossChange)} · ${signed(next.growth,percentage)}</strong></div></div><div class="answer client"><div class="answer-label">Оплата клиента после скидки</div><div class="amount">${nf.format(next.pay)} <span>₽</span></div><div class="change">К текущей оплате <strong>${signed(next.payChange)} · ${signed(next.netGrowth,percentage)}</strong></div></div></div></div><div class="panel chartpanel"><div class="chart-head"><h2>Как меняется стоимость</h2><div class="legend"><span><i></i>В админке</span><span><i class="pay"></i>Оплата клиента</span></div></div>${chart(c.rows)}</div><div class="panel schedule"><h2>Расчёт по месяцам</h2><div class="table-scroll"><table><thead><tr><th>Период</th><th>Сумма в админке<br>и прирост</th><th>Скидка</th><th>Оплата клиента</th></tr></thead><tbody>${c.rows.map(r=>`<tr class="${r.month===0?'nowrow':r.month===1?'nextrow':''}"><td>${r.month?r.month+'-й месяц':'Сейчас'}</td><td>${money(r.gross)}${r.month?`<span class="percent">${signed(r.growth,percentage)} · ${signed(r.grossChange)}</span>`:''}</td><td>${r.discount}%</td><td class="pay">${money(r.pay)}</td></tr>`).join('')}</tbody></table></div><p class="footnote">Оплата клиента = сумма в админке × (1 − скидка). Прирост считается от суммы в админке предыдущего месяца. На экране суммы округлены до рубля.</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-discount]');if(!b)return;state.discount=Number(b.dataset.discount);save();renderInputs();renderResults();document.querySelector(`[data-discount="${state.discount}"]`)?.focus({preventScroll:true})});
for(const key of ['budget']){$(key).addEventListener('input',e=>{state[key]=e.target.value;save();renderResults()});$(key).addEventListener('blur',e=>{e.target.value=formatInput(state[key])})}
let resizeFrame;addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(renderResults)});
renderInputs();renderResults();
</script>
</body>
</html>
